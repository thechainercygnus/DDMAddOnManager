name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  installer:
    permissions:
      contents: write
    if: ${{ !github.event.deleted }}
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build installer
        run: |
          $version = '0.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') {
                  throw "Expected a stable version tag such as v1.2.3."
              }
              $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          ./Build.ps1 -AppOnly -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/DDMAddOnManager-Setup.exe
          archive: false
          if-no-files-found: error

      - name: Publish installer to GitHub Releases
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ./dist/DDMAddOnManager-Setup.exe --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes
